<nav class="app-navbar sticky-top">
  <div class="container-xxl px-3 px-lg-4 d-flex align-items-center py-2">
    <a [href]="urls.simulator" class="navbar-brand mb-0 me-4 fs-4 text-decoration-none">
      <span class="brand-gradient">CDT</span>s
    </a>

    <div class="d-none d-md-flex align-items-center gap-1 me-auto">
      <a
        [href]="urls.simulator"
        [class.active]="active === 'simulator'"
        class="nav-link text-decoration-none"
      >
        <i class="bi bi-graph-up-arrow me-1"></i>Simulador
      </a>
      <a
        *ngIf="isAuthenticated()"
        [href]="urls.account"
        [class.active]="active === 'account'"
        class="nav-link text-decoration-none"
      >
        <i class="bi bi-person-circle me-1"></i>Mi cuenta
      </a>
    </div>

    <div class="d-flex align-items-center gap-2 ms-auto">
      <ng-container *ngIf="user() as u; else guestNav">
        <span class="avatar me-1">{{ initial() }}</span>
        <span class="d-none d-sm-inline text-body-secondary me-2 fw-semibold small">
          {{ u.full_name || u.email }}
        </span>
        <button class="btn btn-outline-secondary btn-sm" (click)="logout()">
          <i class="bi bi-box-arrow-right me-1"></i>Salir
        </button>
      </ng-container>
      <ng-template #guestNav>
        <a [href]="urls.login" class="btn btn-outline-primary btn-sm"> Iniciar sesion </a>
        <a [href]="urls.register" class="btn btn-primary btn-sm"> Crear cuenta </a>
      </ng-template>
    </div>
  </div>
</nav>

<main class="container-xxl px-3 px-lg-4 py-4 flex-grow-1 w-100">
  <ng-content />
</main>

<footer class="app-footer">
  <div
    class="container-xxl px-3 px-lg-4 py-4 d-flex flex-wrap justify-content-between align-items-center gap-3"
  >
    <div class="d-flex align-items-center gap-3">
      <span class="footer-brand fs-5"><span style="color: #a78bfa">CDT</span>s</span>
      <span class="small d-none d-md-inline">Tu dinero merece crecer mejor.</span>
    </div>
    <div class="small text-end">
      Proyecto academico &middot; Simulaciones referenciales &mdash; no constituye asesoria financiera.
    </div>
  </div>
</footer>
