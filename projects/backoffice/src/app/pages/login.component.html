<main class="bo-auth">
  <section class="bo-auth-card" aria-labelledby="backoffice-login-title">
    <div class="bo-mark" aria-hidden="true"><i class="bi bi-shield-lock-fill"></i></div>
    <h1 class="h5 fw-semibold mb-1" id="backoffice-login-title">Backoffice de CDTs</h1>
    <p class="text-secondary small mb-4">Acceso exclusivo para el equipo interno.</p>

    <form id="backoffice-login-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="mb-3">
        <label class="form-label" for="backoffice-email">Correo</label>
        <input
          id="backoffice-email"
          type="email"
          class="form-control"
          formControlName="email"
          autocomplete="username"
          placeholder="nombre@empresa.com"
          required
        />
      </div>

      <div class="mb-3">
        <label class="form-label" for="backoffice-password">Contraseña</label>
        <div class="input-group">
          <input
            id="backoffice-password"
            [type]="showPassword() ? 'text' : 'password'"
            class="form-control"
            formControlName="password"
            autocomplete="current-password"
            required
          />
          <button
            id="backoffice-toggle-password"
            type="button"
            class="btn btn-outline-secondary"
            (click)="showPassword.set(!showPassword())"
            [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            [attr.aria-pressed]="showPassword()"
          >
            <i class="bi" [ngClass]="showPassword() ? 'bi-eye-slash' : 'bi-eye'"></i>
          </button>
        </div>
      </div>

      @if (error()) {
        <div id="backoffice-login-error" class="alert alert-danger py-2 small" role="alert">{{ error() }}</div>
      }

      <button
        id="backoffice-login-submit"
        type="submit"
        class="btn btn-primary w-100 mt-1"
        style="min-height: 42px"
        [disabled]="form.invalid || loading()"
      >
        @if (loading()) {
          <span class="spinner-border spinner-border-sm me-2"></span>
        }
        {{ loading() ? 'Entrando…' : 'Iniciar sesión' }}
      </button>
    </form>
    <p class="bo-auth-foot mb-0">¿Sin acceso? Pide a un administrador que te cree una cuenta.</p>
  </section>
</main>
