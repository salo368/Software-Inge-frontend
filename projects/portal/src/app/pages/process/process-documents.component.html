<p class="text-body-secondary small mb-4">
  Cargamos tus documentos de forma segura y los verificamos automaticamente.
  Aceptamos PDF, JPG o PNG.
</p>

<label id="process-documents-upload" class="upload-box" [class.uploaded]="declaracion" [class.opacity-75]="uploading()">
  <input
    id="process-documents-input"
    type="file"
    class="d-none"
    accept="application/pdf,image/jpeg,image/png"
    [disabled]="uploading()"
    (change)="onFileChange($event)"
  />
  <i
    class="bi"
    [class.bi-cloud-arrow-up]="!declaracion && !uploading()"
    [class.bi-hourglass-split]="uploading()"
    [class.bi-check-circle-fill]="declaracion && !uploading()"
  ></i>
  <div class="flex-grow-1">
    <div class="fw-semibold">Declaracion de renta</div>
    <div id="process-documents-progress" class="small text-body-secondary" *ngIf="uploading()">{{ progressMsg() }}</div>
    <div id="process-documents-empty" class="small text-body-secondary" *ngIf="!uploading() && !declaracion">
      Ultimo periodo disponible. PDF preferentemente.
    </div>
    <div id="process-documents-file" class="small text-body-secondary" *ngIf="!uploading() && declaracion">
      {{ declaracion.original_name || 'Documento cargado' }} &middot; toca para reemplazar
    </div>
  </div>
</label>

<div id="process-documents-actions" *ngIf="declaracion && !uploading()" class="text-end mt-2">
  <button id="process-documents-view" type="button" class="btn btn-sm btn-outline-primary" (click)="openFile()">
    <i class="bi bi-eye me-1"></i>Ver documento
  </button>
</div>

<div id="process-documents-error" *ngIf="error()" class="alert alert-danger py-2 small mt-3 mb-0">{{ error() }}</div>
