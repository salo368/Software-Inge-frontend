service: frontend
frameworkVersion: '3'

provider:
  name: aws
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  stackName: cdts-${sls:stage}-frontend

package:
  patterns:
    - '!./**'

# One bucket per micro frontend block, one CloudFront distribution in front of
# all of them. Blocks are isolated at deploy time (a bad release only touches
# its own bucket) but share a single origin, so the session in localStorage
# and the cookies carry across.
resources:
  Resources:

    SimulatorBucket:
      Type: AWS::S3::Bucket
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        BucketName: cdts-${sls:stage}-frontend-simulator-${aws:accountId}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        OwnershipControls:
          Rules:
            - ObjectOwnership: BucketOwnerEnforced

    PortalBucket:
      Type: AWS::S3::Bucket
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        BucketName: cdts-${sls:stage}-frontend-portal-${aws:accountId}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        OwnershipControls:
          Rules:
            - ObjectOwnership: BucketOwnerEnforced

    SigningBucket:
      Type: AWS::S3::Bucket
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        BucketName: cdts-${sls:stage}-frontend-signing-${aws:accountId}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        OwnershipControls:
          Rules:
            - ObjectOwnership: BucketOwnerEnforced

    CloudFrontOAC:
      Type: AWS::CloudFront::OriginAccessControl
      Properties:
        OriginAccessControlConfig:
          Name: cdts-${sls:stage}-frontend-oac
          OriginAccessControlOriginType: s3
          SigningBehavior: always
          SigningProtocol: sigv4

    SpaRouterFunction:
      Type: AWS::CloudFront::Function
      Properties:
        Name: cdts-${sls:stage}-frontend-spa-router
        AutoPublish: true
        FunctionConfig:
          Comment: Routes extensionless paths to the index.html of their block
          Runtime: cloudfront-js-2.0
        FunctionCode: ${file(./infra/function-code.js):spaRouter}

    CloudFrontDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Enabled: true
          Comment: cdts-${sls:stage}-frontend
          DefaultRootObject: index.html
          HttpVersion: http2
          PriceClass: PriceClass_100
          Origins:
            - Id: SimulatorOrigin
              DomainName: !GetAtt SimulatorBucket.RegionalDomainName
              OriginAccessControlId: !GetAtt CloudFrontOAC.Id
              S3OriginConfig:
                OriginAccessIdentity: ''
            - Id: PortalOrigin
              DomainName: !GetAtt PortalBucket.RegionalDomainName
              OriginAccessControlId: !GetAtt CloudFrontOAC.Id
              S3OriginConfig:
                OriginAccessIdentity: ''
            - Id: SigningOrigin
              DomainName: !GetAtt SigningBucket.RegionalDomainName
              OriginAccessControlId: !GetAtt CloudFrontOAC.Id
              S3OriginConfig:
                OriginAccessIdentity: ''
          CacheBehaviors:
            - PathPattern: /portal/*
              TargetOriginId: PortalOrigin
              ViewerProtocolPolicy: redirect-to-https
              AllowedMethods: [GET, HEAD, OPTIONS]
              CachedMethods: [GET, HEAD]
              Compress: true
              CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
              FunctionAssociations:
                - EventType: viewer-request
                  FunctionARN: !GetAtt SpaRouterFunction.FunctionARN
            - PathPattern: /sign/*
              TargetOriginId: SigningOrigin
              ViewerProtocolPolicy: redirect-to-https
              AllowedMethods: [GET, HEAD, OPTIONS]
              CachedMethods: [GET, HEAD]
              Compress: true
              CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
              FunctionAssociations:
                - EventType: viewer-request
                  FunctionARN: !GetAtt SpaRouterFunction.FunctionARN
          DefaultCacheBehavior:
            TargetOriginId: SimulatorOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            Compress: true
            # CachingOptimized managed policy
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt SpaRouterFunction.FunctionARN

    SimulatorBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref SimulatorBucket
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Sid: AllowCloudFrontRead
              Effect: Allow
              Principal:
                Service: cloudfront.amazonaws.com
              Action: s3:GetObject
              Resource: !Sub '${SimulatorBucket.Arn}/*'
              Condition:
                StringEquals:
                  AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

    PortalBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref PortalBucket
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Sid: AllowCloudFrontRead
              Effect: Allow
              Principal:
                Service: cloudfront.amazonaws.com
              Action: s3:GetObject
              Resource: !Sub '${PortalBucket.Arn}/*'
              Condition:
                StringEquals:
                  AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

    SigningBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref SigningBucket
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Sid: AllowCloudFrontRead
              Effect: Allow
              Principal:
                Service: cloudfront.amazonaws.com
              Action: s3:GetObject
              Resource: !Sub '${SigningBucket.Arn}/*'
              Condition:
                StringEquals:
                  AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

    # Published so the backend can build absolute links into the SPA (the
    # signing email, for one) without a cross-stack import.
    FrontendUrlParameter:
      Type: AWS::SSM::Parameter
      Properties:
        Name: /cdts/${sls:stage}/frontend/url
        Type: String
        Value: !Sub 'https://${CloudFrontDistribution.DomainName}'

  Outputs:
    SimulatorBucketName:
      Value: !Ref SimulatorBucket
      Export:
        Name: cdts-${sls:stage}-frontend-simulator-bucket
    PortalBucketName:
      Value: !Ref PortalBucket
      Export:
        Name: cdts-${sls:stage}-frontend-portal-bucket
    SigningBucketName:
      Value: !Ref SigningBucket
      Export:
        Name: cdts-${sls:stage}-frontend-signing-bucket
    CloudFrontDistributionId:
      Value: !Ref CloudFrontDistribution
      Export:
        Name: cdts-${sls:stage}-frontend-distribution-id
    CloudFrontDomainName:
      Value: !GetAtt CloudFrontDistribution.DomainName
      Export:
        Name: cdts-${sls:stage}-frontend-domain
