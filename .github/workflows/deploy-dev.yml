name: Deploy DEV

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      force_infra:
        description: "Run `sls deploy` even if serverless.yml did not change"
        type: boolean
        default: false
      block:
        description: "Deploy one block only (simulator, portal, signing) or __all__"
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      stage: dev
      force_infra: ${{ inputs.force_infra == true }}
      block: ${{ inputs.block }}
    secrets: inherit
