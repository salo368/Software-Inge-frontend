name: Deploy

# Shared by deploy-dev.yml and deploy-pro.yml. The two stages differ only
# in the GitHub Environment they draw credentials from.
#
# Pipeline shape (mirrors backend/.github/workflows/deploy-dev.yml so
# both repos have the same mental model):
#
#   plan
#    ↓
#   validate                              cross-cutting: edge router + build all
#    ↓
#   infrastructure?  (conditional)        serverless deploy of the CloudFront
#                                         + S3 buckets stack
#    ↓
#   blocks   [matrix, parallel]           one call to block-package.yml per block
#    ├── simulator → validate → test → deploy → integration
#    ├── portal    → validate → test → deploy → integration
#    └── signing   → validate → test → deploy → integration
#    ↓
#   summary                               explicit per-block, per-stage table
#
# `plan-deploy.sh` outputs `blocks_to_deploy`, `run_infrastructure`,
# `transversal`, `blocks_count`, `total_count`. A transversal change
# (angular.json, package.json, projects/shared/**, .github/workflows/**,
# tsconfig, .nvmrc, scripts/ci/deploy.sh) forces blocks_to_deploy = ALL
# blocks. Pure content-only changes to infra (serverless.yml, infra/**)
# run just that infra step and, if no block was already in the plan,
# expand to ALL blocks so the fresh distribution has bucket content.

on:
  workflow_call:
    inputs:
      stage:
        required: true
        type: string
      force_infra:
        required: false
        type: boolean
        default: false
      block:
        description: "Manual override: empty=auto-detect, __all__=full deploy, or a block name."
        required: false
        type: string
        default: ''

permissions:
  contents: read
  # actions:read is needed by the Plan job to run `gh run list --workflow=...`
  # so it can find the SHA of the last successful deploy.
  actions: read

jobs:
  # --------------------------------------------------------------------------
  # 1) plan: what needs to happen?
  # --------------------------------------------------------------------------
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      blocks_to_deploy: ${{ steps.plan.outputs.blocks_to_deploy }}
      blocks_count: ${{ steps.plan.outputs.blocks_count }}
      run_infrastructure: ${{ steps.plan.outputs.run_infrastructure }}
      transversal: ${{ steps.plan.outputs.transversal }}
      total_count: ${{ steps.plan.outputs.total_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Anchor the diff to the SHA of the last successful run of THIS
      # workflow on this branch, not to the parent of the push. This
      # survives failed pipelines: if a prior pipeline landed an infra
      # change but died at Validate before Infrastructure ran, its SHA
      # is not "last successful", so a later push's diff still contains
      # that infra file and Infrastructure will pick it up.
      - name: Find last successful deploy SHA
        id: last-successful
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="$(gh run list \
            --workflow="${GITHUB_WORKFLOW}" \
            --branch="${GITHUB_REF_NAME}" \
            --status=success \
            --limit=1 \
            --json headSha \
            -q '.[0].headSha // empty' 2>/dev/null || true)"
          if [ -n "${sha}" ]; then
            echo "== last successful deploy on ${GITHUB_REF_NAME}: ${sha}"
          else
            echo "== no previous successful deploy on ${GITHUB_REF_NAME}, will fall back to GITHUB_EVENT_BEFORE"
          fi
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"

      - name: Compute deploy plan
        id: plan
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          LAST_SUCCESSFUL_DEPLOY_SHA: ${{ steps.last-successful.outputs.sha }}
          MANUAL_BLOCK: ${{ inputs.block }}
          FORCE_INFRA: ${{ inputs.force_infra && '1' || '0' }}
        run: bash scripts/ci/plan-deploy.sh

  # --------------------------------------------------------------------------
  # 2) validate: cross-cutting checks that are cheaper to run once than per
  #    block. The `edge router` test protects the CloudFront Function that
  #    dispatches every deep link, so a bug there breaks every block. The
  #    workspace-wide `ng build` catches shared/ changes that only surface
  #    when a downstream block tries to consume them.
  #
  #    Per-block validation (build for THIS stage in matrix isolation)
  #    also runs inside each block package, matching backend semantics.
  # --------------------------------------------------------------------------
  validate:
    name: Validate
    needs: plan
    if: needs.plan.outputs.total_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Test the edge router
        # A bug here sends a block's deep links to another block's origin.
        # Kept as a Node built-in test runner target so it stays green
        # even on hosted runners without Chrome.
        run: node --test infra/

      - name: Build every block (workspace sanity)
        # Blocks deploy independently, but a shared change must not
        # break any of them, so all three are compiled regardless of
        # what the plan selected. Failures here abort the whole
        # pipeline before any deploy runs.
        run: |
          set -euo pipefail
          for block in $(node -p "Object.keys(require('./angular.json').projects).filter(n => n !== 'shared').join('\n')"); do
            echo "::group::build ${block}"
            npx ng build "${block}" --configuration ${{ inputs.stage }}
            echo "::endgroup::"
          done

  # --------------------------------------------------------------------------
  # 3) infrastructure: runs BEFORE any block package when the plan asked
  #    for it. Deploys the shared serverless.yml stack (CloudFront +
  #    per-block S3 buckets + edge function). Emits a JSON status
  #    artifact for the summary.
  # --------------------------------------------------------------------------
  infrastructure:
    name: Infrastructure
    needs: [plan, validate]
    if: needs.plan.outputs.run_infrastructure == 'true' && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ inputs.stage }}
      url: https://console.aws.amazon.com/cloudformation/home?region=${{ vars.AWS_REGION }}
    outputs:
      deploy_outcome: ${{ steps.serverless.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Deploy stack
        id: serverless
        run: npx serverless deploy --stage ${{ inputs.stage }} --verbose

      - name: Record infrastructure status
        if: always()
        run: |
          mkdir -p /tmp/status
          cat > /tmp/status/infrastructure.json <<EOF
          {
            "planned": "${{ needs.plan.outputs.run_infrastructure }}",
            "transversal_trigger": "${{ needs.plan.outputs.transversal }}",
            "deploy": "${{ steps.serverless.outcome }}"
          }
          EOF
          echo "----- /tmp/status/infrastructure.json -----"
          cat /tmp/status/infrastructure.json

      - name: Upload infrastructure status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infrastructure-status
          path: /tmp/status/infrastructure.json
          retention-days: 7

  # --------------------------------------------------------------------------
  # 4) blocks: matrix, one call to block-package.yml per block. Waits for
  #    infrastructure (if it ran) so a fresh distribution / bucket is in
  #    place before any block uploads to it. Blocks run in parallel
  #    (fail-fast: false) so one failing block doesn't abort the others.
  # --------------------------------------------------------------------------
  blocks:
    name: ${{ matrix.block }}
    needs: [plan, validate, infrastructure]
    if: >
      always() &&
      needs.plan.outputs.blocks_count != '0' &&
      needs.validate.result == 'success' &&
      (needs.infrastructure.result == 'success' || needs.infrastructure.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        block: ${{ fromJSON(needs.plan.outputs.blocks_to_deploy) }}
    uses: ./.github/workflows/block-package.yml
    secrets: inherit
    with:
      block: ${{ matrix.block }}
      stage: ${{ inputs.stage }}

  # --------------------------------------------------------------------------
  # 5) summary: pulls every block-status-* and the infrastructure-status
  #    artifact and renders an explicit per-block, per-stage table so you
  #    can tell at a glance which block passed, which failed, and at what
  #    stage.
  # --------------------------------------------------------------------------
  summary:
    name: Deploy summary
    needs: [plan, validate, infrastructure, blocks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all status artifacts
        if: always()
        uses: actions/download-artifact@v4
        with:
          pattern: "*-status*"
          path: /tmp/status-in
          merge-multiple: true
        continue-on-error: true

      - name: Render summary
        env:
          STAGE: ${{ inputs.stage }}
        run: |
          # Helper: emoji per outcome. Outcome values from GH:
          #   success | failure | cancelled | skipped | "" (never scheduled)
          ico() {
            case "$1" in
              success)   echo "✅" ;;
              failure)   echo "❌" ;;
              cancelled) echo "🛑" ;;
              skipped)   echo "⏭️" ;;
              "")        echo "—" ;;
              *)         echo "$1" ;;
            esac
          }

          {
            echo "## Deploy ${STAGE}"
            echo ""
            echo "**Plan**"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Blocks to deploy    | \`${{ needs.plan.outputs.blocks_to_deploy }}\` |"
            echo "| Run infrastructure  | ${{ needs.plan.outputs.run_infrastructure }} |"
            echo "| Transversal change  | ${{ needs.plan.outputs.transversal }} |"
            echo ""
            echo "**Stage results**"
            echo ""
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Validate       | $(ico '${{ needs.validate.result }}') ${{ needs.validate.result }} |"
            echo "| Infrastructure | $(ico '${{ needs.infrastructure.result }}') ${{ needs.infrastructure.result }} |"
            echo "| Blocks         | $(ico '${{ needs.blocks.result }}') ${{ needs.blocks.result }} |"
            echo ""

            # -- infrastructure detail --
            if [ -f /tmp/status-in/infrastructure.json ]; then
              echo "**Infrastructure detail**"
              echo ""
              echo "| Field | Value |"
              echo "|---|---|"
              planned=$(jq -r '.planned' /tmp/status-in/infrastructure.json)
              trans=$(jq -r '.transversal_trigger' /tmp/status-in/infrastructure.json)
              dep=$(jq -r '.deploy' /tmp/status-in/infrastructure.json)
              echo "| Planned            | ${planned} |"
              echo "| Transversal-forced | ${trans} |"
              echo "| serverless deploy  | $(ico "${dep}") ${dep} |"
              echo ""
            fi

            # -- per-block detail --
            blocks_found=$(ls /tmp/status-in/*.json 2>/dev/null | grep -v infrastructure || true)
            if [ -n "${blocks_found}" ]; then
              echo "**Per-block detail**"
              echo ""
              echo "| Block | Validate | Test | Deploy | Integration | URL | Stopped at |"
              echo "|---|---|---|---|---|---|---|"
              for f in ${blocks_found}; do
                blk=$(jq -r '.block' "$f")
                v=$(jq -r '.validate' "$f")
                t=$(jq -r '.test' "$f")
                t_specs=$(jq -r '.test_specs_present' "$f")
                d=$(jq -r '.deploy' "$f")
                domain=$(jq -r '.deploy_domain' "$f")
                prefix=$(jq -r '.deploy_prefix' "$f")
                ijob=$(jq -r '.integration_job' "$f")
                ioutcome=$(jq -r '.integration_outcome' "$f")
                ifiles=$(jq -r '.integration_files_present' "$f")

                # Test cell: differentiate "green because it ran"
                # from "green because there were no specs".
                test_cell="$(ico "${t}") ${t}"
                if [ "${t}" = "success" ] && [ "${t_specs}" = "0" ]; then
                  test_cell="⏭️ no specs"
                fi

                # Integration cell same logic as backend.
                int_cell="—"
                if [ "${ijob}" = "skipped" ]; then
                  int_cell="$(ico skipped) skipped"
                elif [ "${ioutcome}" = "" ]; then
                  if [ "${ifiles}" = "0" ]; then
                    int_cell="⏭️ no e2e"
                  else
                    int_cell="$(ico "${ijob}") ${ijob}"
                  fi
                else
                  int_cell="$(ico "${ioutcome}") ${ioutcome}"
                fi

                # URL cell: only meaningful when deploy succeeded.
                url_cell="—"
                if [ "${d}" = "success" ] && [ "${domain}" != "" ] && [ "${domain}" != "null" ]; then
                  url_cell="[${domain}/${prefix}](${domain}/${prefix})"
                fi

                # Where did it stop?
                stopped="—"
                if   [ "${v}" != "success" ]; then stopped="validate"
                elif [ "${t}" != "success" ]; then stopped="test"
                elif [ "${d}" != "success" ]; then stopped="deploy"
                elif [ "${ioutcome}" = "failure" ]; then stopped="integration (non-blocking)"
                else stopped="completed"
                fi

                echo "| \`${blk}\` | $(ico "${v}") | ${test_cell} | $(ico "${d}") | ${int_cell} | ${url_cell} | ${stopped} |"
              done
              echo ""
            fi

            echo "> Legend: ✅ success · ❌ failure · ⏭️ skipped · 🛑 cancelled · — not scheduled"
            echo ">"
            echo "> Integration is dev-only and non-blocking: a failure there does NOT roll back the deploy that already succeeded. Test / integration cells marked \`no specs\` / \`no e2e\` are green because the corresponding suite is not yet wired -- add \`*.spec.ts\` files or a \`projects/<block>/e2e/\` folder to activate."
          } >> "$GITHUB_STEP_SUMMARY"
