name: Deploy

# Shared by deploy-dev.yml and deploy-pro.yml. The two stages differ only in the
# GitHub Environment they draw credentials from.
#
# Each micro frontend block builds and ships on its own, so a release of one
# block never touches another block's bucket or cache.

on:
  workflow_call:
    inputs:
      stage:
        required: true
        type: string
      force_infra:
        required: false
        type: boolean
        default: false
      block:
        description: Deploy a single block, or __all__ for every one.
        required: false
        type: string
        default: ''

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      blocks: ${{ steps.plan.outputs.blocks }}
      count: ${{ steps.plan.outputs.count }}
      infra: ${{ steps.plan.outputs.infra }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute plan
        id: plan
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          MANUAL_BLOCK: ${{ inputs.block }}
          FORCE_INFRA: ${{ inputs.force_infra && '1' || '0' }}
        run: bash scripts/ci/plan-deploy.sh

  validate:
    name: Validate
    needs: plan
    if: needs.plan.outputs.count != '0' || needs.plan.outputs.infra == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Test the edge router
        # A bug here sends a block's deep links to another block's origin.
        run: node --test infra/

      - name: Build every block
        # Blocks deploy independently, but a shared change must not break any
        # of them, so all three are compiled regardless of the plan.
        run: |
          for block in simulator portal signing; do
            echo "::group::build ${block}"
            npx ng build "${block}" --configuration ${{ inputs.stage }}
            echo "::endgroup::"
          done

  infra:
    name: Infra (S3 + CloudFront)
    needs: [plan, validate]
    if: needs.plan.outputs.infra == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.stage }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Install dependencies
        # npm install (not ci): Angular's lock file has multiple versions of
        # chokidar/readdirp in the tree; npm ci rejects it as inconsistent.
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Deploy stack
        run: npx serverless deploy --stage ${{ inputs.stage }} --verbose

  deploy:
    name: ${{ matrix.block }}
    needs: [plan, validate, infra]
    if: always() && needs.plan.outputs.count != '0' && needs.validate.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.stage }}
      url: ${{ steps.urls.outputs.domain }}
    strategy:
      fail-fast: false
      matrix:
        block: ${{ fromJSON(needs.plan.outputs.blocks) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Resolve block coordinates
        id: block
        run: bash scripts/ci/block-info.sh "${{ matrix.block }}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: npx ng build ${{ matrix.block }} --configuration ${{ inputs.stage }}

      - name: Read stack outputs
        id: urls
        run: |
          get() {
            aws cloudformation describe-stacks --stack-name "cdts-${{ inputs.stage }}-frontend" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text
          }
          {
            echo "bucket=$(get '${{ steps.block.outputs.BUCKET_OUTPUT }}')"
            echo "dist_id=$(get CloudFrontDistributionId)"
            echo "domain=https://$(get CloudFrontDomainName)"
          } >> "$GITHUB_OUTPUT"

      - name: Upload to S3 and invalidate CloudFront
        env:
          BUCKET: ${{ steps.urls.outputs.bucket }}
          DIST_ID: ${{ steps.urls.outputs.dist_id }}
          DIST_DIR: ${{ steps.block.outputs.DIST_DIR }}
          PREFIX: ${{ steps.block.outputs.PREFIX }}
        run: bash scripts/ci/deploy.sh

      - name: Summary
        if: always()
        run: |
          {
            echo "### ${{ matrix.block }} (${{ inputs.stage }})"
            echo ""
            echo "- URL: ${{ steps.urls.outputs.domain }}/${{ steps.block.outputs.PREFIX }}"
            echo "- Bucket: \`${{ steps.urls.outputs.bucket }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
